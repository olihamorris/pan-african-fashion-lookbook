

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lookbook — Pan-African Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Josefin+Sans:wght@300;400;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container page-main">
    <section class="page-hero">
      <h1>Lookbook</h1>
      <p class="tagline">Browse curated images by region, designer or fabric.</p>

      <div class="filters">
        <input id="search-input" type="search" placeholder="Search by fabric, designer or keyword">
        <select id="region-select">
          <option value="all">All Regions</option>
          <option value="north">North Africa</option>
          <option value="west">West Africa</option>
          <option value="east">East Africa</option>
          <option value="south">Southern Africa</option>
        </select>
        <button id="search-btn" class="btn">Search</button>
      </div>
    </section>

    <section class="gallery-section">
      <div id="gallery" class="gallery-grid gallery" aria-live="polite"></div>
      <div id="load-more-wrap" class="center"><button id="load-more" class="btn">Load more</button></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="../js/header.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
