<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact Us</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Josefin+Sans:wght@300;400;600&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container page-main contact-page">
    <h1>Contact Us</h1>
    <form id="contact-form" class="contact-form" action="#" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit" class="btn">Send</button>
    </form>
  </main>
  <footer id="site-footer"></footer>
  <script type="module" src="../js/header.js"></script>
  <script type="module" src="../js/footer.js"></script>
  <script type="module" src="../js/utils.js"></script>
  <script type="module" src="../js/main.js"></script>
</body>
</html>
